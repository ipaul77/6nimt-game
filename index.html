<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>6Nimmt! AI Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #090212; color: #ecf0f1; touch-action: manipulation; }
        .casino-table { width: 100%; max-width: 800px; height: 100%; margin: 0 auto; background: linear-gradient(145deg, #1b0a2e, #090212); display: flex; flex-direction: column; position: relative; transition: box-shadow 0.5s; }
        .neon-surface { flex: 1; display: flex; flex-direction: column; position: relative; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
        .top-bar { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; z-index: 100; }
        .top-btn { background: rgba(138, 43, 226, 0.2); border: 1px solid #8a2be2; color: #d8b4fe; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .login-container, .lobby-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; text-align: center; }
        .title-glow { font-size: 3.5rem; margin: 0; color: #fff; text-shadow: 0 0 15px #8a2be2; font-style: italic; }
        input, .casino-btn { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; font-weight: bold; font-size: 1rem; }
        input { border: 2px solid #8a2be2; background: rgba(0,0,0,0.6); color: #fff; text-align: center; }
        .casino-btn { background: linear-gradient(45deg, #8a2be2, #4a00e0); color: white; cursor: pointer; }
        .btn-start { background: linear-gradient(45deg, #ff007a, #7928ca); }
        .opponents-bar { display: flex; overflow-x: auto; gap: 8px; padding: 10px; background: rgba(0,0,0,0.4); min-height: 90px; align-items: center; border-bottom: 1px solid rgba(138,43,226,0.3); }
        .op-badge { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 5px; min-width: 60px; position: relative; }
        .my-badge { border-color: #00f0ff; background: rgba(0,240,255,0.1); }
        .badge-card-zone { height: 45px; display: flex; align-items: center; justify-content: center; }
        .badge-card-zone .card { transform: scale(0.5); margin: 0; }
        .board-rows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px; }
        .card-row { display: flex; gap: 5px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; min-height: 75px; align-items: center; border-left: 4px solid #8a2be2; transition: 0.3s; }
        .danger-row { border-left-color: #ff007a; background: rgba(255,0,122,0.1); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 5px rgba(255,0,122,0.2); } 50% { box-shadow: 0 0 20px rgba(255,0,122,0.5); } }
        .card { width: 50px; height: 75px; border-radius: 6px; border: 2px solid #555; background: #1a252f; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-weight: 900; position: relative; overflow: hidden; transition: 0.2s; }
        .card-val { font-size: 1.4rem; z-index: 2; }
        .card-bullheads { font-size: 0.7rem; z-index: 2; }
        .playable:hover { transform: translateY(-10px); border-color: #00f0ff; }
        .flying { animation: fly 0.4s forwards; }
        @keyframes fly { to { transform: translateY(-100px) scale(0); opacity: 0; } }
        #my-cards { display: flex; gap: 8px; overflow-x: auto; padding: 15px; background: #000; border-top: 2px solid #8a2be2; }
        #penalty-flash-overlay { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 9999; display: none; align-items: center; justify-content: center; }
        .flash-active { display: flex !important; animation: redFlash 1s forwards; }
        @keyframes redFlash { 0% { background: rgba(255,0,0,0.7); } 100% { background: transparent; } }
        .earthquake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-5px, 5px); } 75% { transform: translate(5px, -5px); } }
        .kick-btn { background: #ff007a; border: none; color: white; border-radius: 5px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; }
        .tutorial-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; }
        .tutorial-content { background: #1b0a2e; border: 2px solid #00f0ff; padding: 20px; border-radius: 15px; max-width: 350px; }
    </style>
</head>
<body>
    <div id="penalty-flash-overlay"><h1 id="penalty-text" style="color:white; font-size:3rem; text-shadow:0 0 20px red;"></h1></div>
    <div id="tutorial-modal" class="tutorial-modal"><div class="tutorial-content"><h3>📖 게임 규칙</h3><p>1. 매 턴 카드를 1장 냅니다.<br>2. 작은 숫자부터 자동 배치됩니다.<br>3. 6번째 카드를 놓으면 벌점을 먹습니다.<br>4. 낼 곳이 없으면 행 하나를 통째로 먹어야 합니다!</p><button class="casino-btn" onclick="hideTutorial()">알겠어!</button></div></div>

    <div class="casino-table" id="main-table">
        <div class="neon-surface" id="ui-layer">
            <div id="login-area" class="login-container">
                <h1 class="title-glow">6Nimmt!</h1>
                <input type="text" id="nickname-input" placeholder="닉네임 입력">
                <button class="casino-btn" onclick="enterLobby()">게임 입장</button>
                <button class="top-btn" onclick="showTutorial()" style="margin-top:10px;">❓ 규칙 보기</button>
            </div>

            <div id="lobby-area" class="lobby-container" style="display:none;">
                <h2 style="color:#00f0ff;">방 목록</h2>
                <div id="room-list" style="height:200px; overflow-y:auto; margin-bottom:15px;"></div>
                <button class="casino-btn" onclick="createRoom()">+ 새 방 만들기</button>
            </div>

            <div id="game-setup-area" style="display:none; padding:50px 20px;">
                <h2 id="room-title"></h2>
                <div id="player-list" style="background:rgba(0,0,0,0.5); border-radius:10px; padding:10px; margin-bottom:20px;"></div>
                <div id="host-controls" style="display:none;">
                    <div style="display:flex; justify-content:center; align-items:center; gap:15px; margin-bottom:15px;">
                        <span>봇 수:</span>
                        <button class="top-btn" onclick="changeBotCount(-1)">-</button>
                        <span id="bot-count-val">1</span>
                        <button class="top-btn" onclick="changeBotCount(1)">+</button>
                        <button class="top-btn" onclick="addBots()">추가</button>
                    </div>
                    <button id="start-btn" class="casino-btn btn-start" onclick="startGame()">게임 시작</button>
                </div>
                <button id="ready-btn" class="casino-btn" onclick="toggleReady()" style="display:none;">준비하기</button>
            </div>

            <div id="play-area" style="display:none; height:100%; flex-direction:column;">
                <div class="top-bar">
                    <span id="penalty-display" style="color:#ff007a; font-weight:bold;">누적 벌점: 0 🐂</span>
                    <button class="top-btn danger" onclick="socket.emit('stopGame')">중단</button>
                </div>
                <div class="opponents-bar" id="opponents-bar"></div>
                <div class="board-rows" id="board-rows"></div>
                <div id="status-text" style="text-align:center; padding:5px; color:#00f0ff;">카드를 선택하세요</div>
                <div id="my-cards"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let amIHost = false; let myNickname = ''; let localPenalty = 0; let botCount = 1;
        
        // 💡 오디오 엔진 (심장박동 & 효과음)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let isUnlocked = false;
        let heartbeatOsc = null; let heartbeatTimeout = null;

        function unlockAudio() {
            if(isUnlocked) return;
            audioCtx = new AudioCtx();
            const msg = new SpeechSynthesisUtterance('unlocked'); msg.volume = 0;
            window.speechSynthesis.speak(msg);
            isUnlocked = true;
        }
        window.addEventListener('click', unlockAudio);

        // 💡 동적 심장박동 생성 함수
        function playHeartbeat(bpm) {
            if(!audioCtx) return;
            if(heartbeatTimeout) clearTimeout(heartbeatTimeout);
            
            const duration = 60 / bpm;
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(60, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(now + 0.1);
            
            heartbeatTimeout = setTimeout(() => playHeartbeat(bpm), duration * 1000);
        }

        function stopHeartbeat() { 
            if(heartbeatTimeout) clearTimeout(heartbeatTimeout);
            document.getElementById('main-table').style.boxShadow = "none";
        }

        // 💡 성격별 TTS 로직
        function speakBot(name, text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ko-KR';
            if(name.includes('극대노')) { msg.pitch = 1.6; msg.rate = 1.4; }
            else if(name.includes('소심한')) { msg.pitch = 1.3; msg.rate = 0.8; }
            else if(name.includes('깐족')) { msg.pitch = 1.1; msg.rate = 1.3; }
            else if(name.includes('흑염룡')) { msg.pitch = 0.5; msg.rate = 0.7; }
            else if(name.includes('이장님')) { msg.pitch = 0.7; msg.rate = 0.6; }
            window.speechSynthesis.speak(msg);
        }

        // 효과음
        socket.on('actionSound', (type) => {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            if(type==='play') { osc.type='sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now+0.1); g.gain.setValueAtTime(0.3, now); }
            else { osc.type='sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(20, now+0.5); g.gain.setValueAtTime(0.5, now); }
            g.gain.exponentialRampToValueAtTime(0.01, now+0.2);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(now+0.5);
        });

        function showTutorial() { document.getElementById('tutorial-modal').style.display='flex'; }
        function hideTutorial() { document.getElementById('tutorial-modal').style.display='none'; }
        function changeBotCount(v) { botCount = Math.max(1, Math.min(9, botCount + v)); document.getElementById('bot-count-val').innerText = botCount; }
        function enterLobby() { 
            myNickname = document.getElementById('nickname-input').value.trim();
            if(!myNickname) return alert('닉네임!');
            document.getElementById('login-area').style.display='none';
            document.getElementById('lobby-area').style.display='block';
        }
        function createRoom() {
            const name = prompt('방 제목:');
            if(name) socket.emit('createRoom', { nickname: myNickname, roomName: name, avatar: '😎' });
        }
        socket.on('roomList', (list) => {
            const el = document.getElementById('room-list'); el.innerHTML = '';
            list.forEach(r => {
                const d = document.createElement('div'); d.className='casino-btn'; d.style.fontSize='0.8rem';
                d.innerText = `${r.name} (${r.playerCount}/10)`;
                d.onclick = () => socket.emit('joinRoom', { nickname: myNickname, roomId: r.id, avatar: '😎' });
                el.appendChild(d);
            });
        });
        socket.on('joinSuccess', (data) => {
            amIHost = data.isHost;
            document.getElementById('lobby-area').style.display='none';
            document.getElementById('game-setup-area').style.display='block';
            document.getElementById('room-title').innerText = data.roomName;
            document.getElementById('host-controls').style.display = amIHost ? 'block' : 'none';
            document.getElementById('ready-btn').style.display = amIHost ? 'none' : 'block';
        });
        function addBots() { socket.emit('addBots', botCount); }
        function toggleReady() { socket.emit('toggleReady'); }
        function startGame() { socket.emit('startGame'); }
        
        socket.on('updatePlayers', (ps) => {
            const me = ps.find(p=>p.id===socket.id);
            if(me && me.isHost) { amIHost=true; document.getElementById('host-controls').style.display='block'; document.getElementById('ready-btn').style.display='none'; }
            const el = document.getElementById('player-list'); el.innerHTML = '';
            ps.forEach(p => {
                el.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px;">
                    <span>${p.avatar} ${p.name} ${p.isHost?'👑':''}</span>
                    <span>${p.isReady?'✅':'⏳'} ${amIHost && !p.isHost ? `<button class="kick-btn" onclick="socket.emit('kickPlayer','${p.id}')">추방</button>` : ''}</span>
                </div>`;
            });
            document.getElementById('start-btn').disabled = !(ps.length >= 2 && ps.every(p=>p.isReady));
        });

        socket.on('gameStarted', () => {
            document.getElementById('game-setup-area').style.display='none';
            document.getElementById('play-area').style.display='flex';
        });

        function createCardDOM(card, playable, hidden=false) {
            const d = document.createElement('div'); d.className = 'card' + (playable?' playable':'');
            if(hidden) { d.innerHTML = '<div class="card-val" style="opacity:0.2">?</div>'; return d; }
            d.dataset.bull = card.bullheads;
            d.innerHTML = `<div class="card-val">${card.number}</div><div class="card-bullheads">${'🐂'.repeat(card.bullheads)}</div>`;
            if(card.bullheads >= 5) d.style.borderColor = '#ff007a';
            return d;
        }

        socket.on('updateGame', (state) => {
            const me = state.playersInfo.find(p=>p.id===socket.id);
            if(me.penalty > localPenalty) {
                const diff = me.penalty - localPenalty;
                document.getElementById('penalty-text').innerText = `+${diff} 🐂`;
                const ov = document.getElementById('penalty-flash-overlay');
                ov.classList.remove('flash-active'); void ov.offsetWidth; ov.classList.add('flash-active');
                document.body.classList.add('earthquake'); setTimeout(()=>document.body.classList.remove('earthquake'), 500);
                if(navigator.vibrate) navigator.vibrate([200,100,200]);
            }
            localPenalty = me.penalty;
            document.getElementById('penalty-display').innerText = `누적 벌점: ${me.penalty} 🐂`;

            // 💡 심장박동 로직: 5장 쌓인 행 체크
            const dangers = state.rows.filter(r=>r.length===5).length;
            if(dangers > 0) {
                const bpm = 60 + (dangers * 30);
                playHeartbeat(bpm);
                document.getElementById('main-table').style.boxShadow = `inset 0 0 ${dangers*20}px rgba(255,0,0,0.5)`;
            } else stopHeartbeat();

            const obar = document.getElementById('opponents-bar'); obar.innerHTML = '';
            state.playersInfo.forEach(p => {
                const status = state.submittedStatus.find(s=>s.id===p.id);
                const badge = document.createElement('div'); badge.className = 'op-badge' + (p.id===socket.id?' my-badge':'');
                const zone = document.createElement('div'); zone.className = 'badge-card-zone';
                if(status.card) zone.appendChild(createCardDOM(status.card, false));
                else if(status.hasSubmitted) zone.appendChild(createCardDOM({}, false, true));
                else zone.innerHTML = '🤔';
                badge.appendChild(zone);
                badge.innerHTML += `<div style="font-size:0.7rem">${p.name}</div><div style="font-size:0.8rem; color:#ff4d4d">🐂 ${p.penalty}</div>`;
                obar.appendChild(badge);
            });

            const brows = document.getElementById('board-rows'); brows.innerHTML = '';
            state.rows.forEach((r, i) => {
                const rowDiv = document.createElement('div'); rowDiv.className = 'card-row' + (r.length===5?' danger-row':'');
                rowDiv.innerHTML = `<span style="color:#8a2be2; font-weight:bold; margin-right:5px;">${i+1}</span>`;
                r.forEach(c => rowDiv.appendChild(createCardDOM(c, false)));
                brows.appendChild(rowDiv);
            });

            const myStatus = state.submittedStatus.find(s=>s.id===socket.id);
            const canPlay = state.phase === 'PLAYING' && !myStatus.hasSubmitted;
            document.getElementById('status-text').innerText = canPlay ? '카드를 한 장 내세요' : '대기 중...';
            
            const handEl = document.getElementById('my-cards'); handEl.innerHTML = '';
            state.myHand.forEach((c, i) => {
                const cd = createCardDOM(c, canPlay);
                if(canPlay) cd.onclick = () => { cd.classList.add('flying'); setTimeout(()=>socket.emit('submitCard', i), 300); };
                handEl.appendChild(cd);
            });
        });

        socket.on('requireRowSelection', (data) => {
            const brows = document.getElementById('board-rows'); brows.innerHTML = '<h3 style="color:#ff007a">행 선택! (가장 작은 벌점 클릭)</h3>';
            data.rows.forEach((r, i) => {
                const btn = document.createElement('div'); btn.className = 'card-row';
                btn.style.cursor = 'pointer';
                const penalty = r.reduce((s,c)=>s+c.bullheads,0);
                btn.innerHTML = `<span>행 ${i+1} (벌점 ${penalty})</span>`;
                btn.onclick = () => socket.emit('selectRow', i);
                brows.appendChild(btn);
            });
        });

        socket.on('systemMessage', (msg) => {
            const toast = document.createElement('div'); toast.className = 'toast';
            toast.innerText = msg; document.body.appendChild(toast);
            setTimeout(()=>toast.remove(), 4000);
            
            // 💡 AI 대사 TTS 처리
            if(msg.includes('💬')) {
                const name = msg.split(':')[0].replace('💬 ', '');
                const content = msg.split('"')[1];
                speakBot(name, content);
            }
        });
        
        socket.on('gameStopped', () => location.reload());
        socket.on('kicked', () => { alert('추방됨'); location.reload(); });
        socket.on('gameOver', (sorted) => {
            stopHeartbeat();
            const el = document.getElementById('penalty-text'); el.innerText = 'ROUND OVER';
            document.getElementById('penalty-flash-overlay').style.display='flex';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        });
    </script>
</body>
</html>
